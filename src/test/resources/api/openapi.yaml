components:
  responses:
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: 唯一性占用 / 资源状态不允许该操作（`code` 指明具体原因）
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: 已登录但无权限（`AUTH_FORBIDDEN`）
    InternalError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: 服务器内部错误（`SYSTEM_INTERNAL` / `SYSTEM_DATABASE`）
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: 资源不存在（`code` 指明是哪类资源，如 `CONTENT_NOT_FOUND`）
    ParamInvalid:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: "请求参数不合法（校验族失败时带 `errors[]`；业务拒绝只有 `msg`）"
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: 触发限流（`RATE_LIMITED`）
      headers:
        Retry-After:
          description: 建议退避的秒数
          schema:
            type: integer
            format: int32
    ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: 依赖暂不可用（`SYSTEM_UNAVAILABLE`）—— **可重试**，按 `Retry-After` 退避
      headers:
        Retry-After:
          description: 建议退避的秒数
          schema:
            type: integer
            format: int32
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: 未登录 / 令牌无效或过期（`code` ∈ `AUTH_UNAUTHORIZED` / `AUTH_TOKEN_EXPIRED`）
    UnsupportedMediaType:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: 不支持的 `Content-Type`（`PARAM_MEDIA_TYPE_UNSUPPORTED`）
  schemas:
    AddCoinRequest:
      type: object
      properties:
        count:
          type: integer
          format: int32
      required:
      - count
    AddCommentRequest:
      type: object
      properties:
        contentId:
          type: integer
          format: int64
          exclusiveMinimum: 0
        message:
          type: string
          maxLength: 1000
          minLength: 0
        parentId:
          type: integer
          format: int64
      required:
      - contentId
      - message
    AddFavoriteRequest:
      type: object
      properties:
        contentId:
          type: integer
          format: int64
        folderId:
          type: integer
          format: int64
      required:
      - contentId
    AdminContentVO:
      type: object
      properties:
        authorName:
          type: string
        hidden:
          type: boolean
        id:
          type: integer
          format: int64
        title:
          type: string
        type:
          type: integer
          format: int32
    ApiError:
      type: object
      description: "失败体：`{code, msg, errors?}`。**没有 `data`** —— 成功体才是 `{code:\"OK\"\
        , msg, data?}`。"
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        errors:
          type: array
          description: 字段级错误；只在**校验族**（`@Valid` / 缺参 / 类型不可转换 / 请求体不可解析）出现
          items:
            $ref: "#/components/schemas/ApiFieldError"
        msg:
          type: string
          description: 给人读的兜底文案（前端可覆盖；不要按它的中文做分支）
      required:
      - code
      - msg
    ApiFieldError:
      type: object
      description: "`errors[]` 元素：把错误挂到具体输入框上。"
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        field:
          type: string
          description: '**请求里的字段名**；定位不到时该键不出现（不编名）'
        message:
          type: string
          description: 稳定文案；**不回显**异常 message（那里面可能有客户端发来的值）
      required:
      - code
      - message
    ApiResponseBoolean:
      type: object
      properties:
        code:
          type: string
        data:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiFieldError"
        msg:
          type: string
    ApiResponseCoinBalanceVO:
