# ============================================================================
# MySpringTV — 应用配置
# ----------------------------------------------------------------------------
# 口径（决策⑨）：application.yml + profiles；敏感值走环境变量；
#                TV 的 AppConfig「多级覆盖链」退役，改由 Spring 标准机制承担。
#
# 本阶段只配「基础设施」三项（数据源 / Redis / RabbitMQ）+ Flyway。
# 业务参数（cache.* / feed.* / jwt.*）等对应代码迁移时再逐块加入，
# 避免把 TV 的 60 个扁平键一次性照搬成"配置债"。
#
# 环境变量约定：SPRING_* 由 Spring Boot 宽松绑定自动识别，
# 因此 ${DB_PASSWORD:MySQL} 亦可写成环境变量 DB_PASSWORD。
# ============================================================================

spring:
  application:
    name: MySpringTV

  # --------------------------------------------------------------------------
  # 数据源（决策②）：HikariCP 由 mybatis-spring-boot-starter 传递引入
  # 口径差异：TV 是自研 MyConnectionPool（initSize/maxSize/timeoutMs）；
  #          此处换成 Hikari，参数按语义对映（initSize→minimum-idle,
  #          maxSize→maximum-pool-size, timeoutMs→connection-timeout）。
  # CAUTION: 本机 3306 是**宿主原生 mysqld 8.0.45**，不是 Docker 的 mysql8.4
  #          （那个映射在 3307，当前未启动）。旧配置与真库口径一致。
  # --------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/TVDatabase?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:MySQL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: ${DB_POOL_TIMEOUT_MS:5000}
      pool-name: MySpringTV-Hikari

  # --------------------------------------------------------------------------
  # Flyway（决策⑥）：SQL-first，V1 baseline = TV 现结构（见 db/migration）
  # baseline-version=0 是关键：让 baseline 标记落在 0，
  #   于是 V1 在**已有库**（结构已存在 ⇒ V1 成为 no-op）与
  #   **空库/测试容器**（真正建结构）上都会被应用，一套脚本服务两种环境。
  #   若 baseline-version=1，则已有库会跳过 V1、空库会执行 V1，
  #   两边分叉 —— 正是要避免的。
  # 提醒：Flyway 管结构演进，不是备份；业务数据仍靠 dump（决策⑥）。
  # --------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "TV baseline (schema as-is)"
    validate-on-migrate: true
    clean-disabled: true          # 防误删：clean 永不开放

  # --------------------------------------------------------------------------
  # Redis（决策⑤）：Jedis 客户端（Lettuce 已在 pom 中排除）
  # 超时口径沿用 TV：connect/so 各 1000ms，池 maxWait 1000ms。
  # 熔断由 Resilience4j 承接（第三批 T3 / 账 B4），配置见 video.cache.redis-breaker。
  # 注意 Boot 4 前缀为 spring.data.redis.*（旧教程的 spring.redis.* 已废）。
  # --------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      client-type: jedis
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:1000}ms
      timeout: ${REDIS_SO_TIMEOUT_MS:1000}ms
      jedis:
        pool:
          max-active: ${REDIS_MAX_TOTAL:50}
          max-idle: ${REDIS_MAX_IDLE:10}
          min-idle: ${REDIS_MIN_IDLE:5}
          max-wait: ${REDIS_POOL_MAX_WAIT_MS:1000}ms

  # --------------------------------------------------------------------------
  # RabbitMQ（决策④）：Spring AMQP 接管 TV 手写的 4 个 MQ 坑
  # 重试语义刻意区分（TV 易错点）：
  #   listener.simple.retry.maxRetries = **首次之外**的重试次数（对齐 TV 的 2）
  #   template.retry 同理（发布侧重试）
  #   —— 与 Resilience4j 的 maxAttempts（含首次调用）不是同一口径。
  # vhost 键名是 virtual-host（不是 vhost）。
  # --------------------------------------------------------------------------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT_MS:2000}ms
    listener:
      simple:
        # 预取 1（S9）：对齐 TV MqConsumerContainer.DEFAULT_PREFETCH=1——prefetch 大于 1 会让同一
        # 队列在途多条，失败重试时"本队列没有可处理的消息被耽搁"这条平衡被打破。Boot 默认 250。
        prefetch: 1
        # 单消费者（S9）：对齐 TV"每队列一条消费 channel"的口径（隔离 head-of-line）。
        concurrency: 1
        # 确认模式 auto（S9）：与 TV 的"手动 ack + 失败 nack(requeue=false)"**语义等价**——
        # 成功⇒ack；重试耗尽⇒reject（default-requeue-rejected=false）⇒ 经队列 DLX 转死信。
        acknowledge-mode: auto
        retry:
          enabled: true
          # max-retries = **首次之外**的重试次数（对齐 TV feed.consume.retry.maxRetries=2）。
          max-retries: 2
          # ⚠️ multiplier=1（**有意**）：TV 是**固定**退避（feed.consume.retry.backoffMillis=1000，
          # 无限乘），不是指数。写 2 会变成指数退避（1s→2s→4s…），与 TV 的"总等待上界 = 次数 × 本值
          # 简单可证"口径不符。故固定为 1×initial-interval。
          multiplier: 1
          initial-interval: 1000ms
          max-interval: 10000ms
        default-requeue-rejected: false   # 重试耗尽后不重回队列，交给 DLQ

  # --------------------------------------------------------------------------
  # Multipart 上传限额（S7）：对齐 TV UploadController / MediaAdminController 的
  # @MultipartConfig(maxFileSize=50MB, maxRequestSize=100MB)。
  # ⚠️ TV 的 app.properties 里另有 upload.maxSize=104857600，实测**零消费者**
  #    （仅 AppConfig.getUploadMaxSize 定义处），按"不搬无主配置"丢弃（《决策留痕表》B-13）。
  # --------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# ----------------------------------------------------------------------------
# MyBatis（决策②）：mapper 以 XML 为主
# ----------------------------------------------------------------------------
# ⚠️ 前缀是 **mybatis.**（顶层），**不是 spring.mybatis.**。
# MybatisProperties 的 @ConfigurationProperties(MYBATIS_PREFIX)，实测确认前缀为 "mybatis"。
# 写成 spring.mybatis.* 会被**静默忽略**（不报错），表现为运行期
# "Invalid bound statement (not found)" —— 症状离病因很远，故此处显式记录。
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # resultMap 已显式声明列→属性映射，**不**依赖下划线的隐式转换
    # （保持显式，避免"改名后静默映射错列"）
    map-underscore-to-camel-case: false

# ----------------------------------------------------------------------------
# 业务配置
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# 业务配置（统一挂在 video.* 下；⚠️ 不要写第二个顶层 video: 键——
# YAML 重复键会覆盖前面的，video.jwt 会被悄悄吃掉，表现为登录直接 500）
# ----------------------------------------------------------------------------

# JWT（决策③「保留 jwt，暂不迁移 Spring Security」）
# 口径沿袭 TV：HMAC256 自签发，单 Token，sub = userId。
# TV 把 secret 硬编码为 "STONE" 且无覆盖机制（AppConfig.getJwtSecret() 直读常量）；
# 此处改为可配置 + 环境变量可覆盖。dev 默认值仅为开箱可跑，⚠️ 部署前必须换掉。
video:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-in-production}
    # ⚠️ 必须带单位后缀（2h），**不能**写裸数字 2。
    # 绑定目标是 java.time.Duration：裸数字会被当作"2 个单位、无单位"，解析为 **PT2S（2 秒）**，
    # 于是签发的 token 在 iat 之后 2 秒即过期，表现为"刚登录就 401"，且**不报任何配置错误**。
    # 这类静默误解析正是切片 0 踩到的坑（JwtPropertiesBindingTests 已加断言防回归）。
    # TV 原值 jwt.expireHours=2（小时），此处等价表达为 2h。
    expire-hours: ${JWT_EXPIRE_HOURS:2h}

  # 缓存（决策⑤：显式封装层，不用 @Cacheable）
  # 口径对齐 TV AppConfig.getLikeTtlSeconds() ← app.properties 的 cache.like.ttlMinutes=15。
  # ⚠️ 同上：Duration 属性**必须带单位后缀**。写裸数字 15 会解析成 PT15S（15 秒），
  # 缓存几乎立刻失效——不报错，只是命中率莫名很低。
  cache:
    like-ttl: ${LIKE_CACHE_TTL:15m}
    # 关注关系缓存（S4 切片）。口径对齐 TV AppConfig.getFollowTtlSeconds()
    # ← app.properties 的 cache.follow.ttlMinutes=30。
    # TV 取值理由（原注释）："follow 30min（关系低频变 + MULTI 双写失效清晰；
    # 压测以空关系为主，依据写路径特性保守延长）"——刻意比 like 的 15 分钟长。
    # ⚠️ 同上：Duration 属性**必须带单位后缀**，写裸数字 30 会解析成 PT30S。
    follow-ttl: ${FOLLOW_CACHE_TTL:30m}
    # 内容缓存（S5 切片）。口径对齐 TV AppConfig.getContentTtlMillis()
    # ← app.properties 的 cache.content.ttlMinutes=30。
    # TV 理由（原注释）："content 30min（热读域：启动全量重建后恒 100% hitData +
    # 滑动续期后热点常驻，miss≈0 无穿透风险）"。
    # ⚠️ 但本切片**不搬** ContentCache.init() 的启动全量重建（决策表 G-6：其产物两条都有
    #    自愈路径，只是预热；代价是启动期一次无上限全表查询）⇒ 首读会 miss 并回源 DB，
    #    TTL 值本身不变。
    # ★ 第四批 T7-2：**已由"暂不搬"定为"永不补"**（《遗留台账》B5 → D29）——
    #    当初挂的补回条件是"接入压测或真实规模"，到第四批收口时该前提仍未成立，
    #    继续挂着只是把"无 owner"伪装成"待办"。**不要再写"接压测时回补"了。**
    content-ttl: ${CONTENT_CACHE_TTL:30m}
    # 索引懒重建失败的**进程内冷却退避**窗口（第三批 T3 / 账 B6）。口径对齐 TV
    # AppConfig.getContentIndexRebuildCooldownMillis() ← app.properties 的
    # cache.content.indexRebuildCooldownMillis=10000（10s）。
    # 含义：DB 故障 + 索引缺失时，把"每请求一次全表重建（findAllContent）"收敛为"每冷却窗口一次"。
    # ⚠️ 0 = 关闭退避（与 TV 同口径，"测试注入大值即等效关闭"）。
    # ⚠️ 必须带单位后缀，写裸数字会被解析成秒级。
    content-index-rebuild-cooldown: ${CONTENT_INDEX_REBUILD_COOLDOWN:10s}
    # ------------------------------------------------------------------------
    # Redis 熔断器（第三批 T3 / 账 B4）。对应 TV app.properties 的 redis.breaker.*
    # （failureThreshold / cooldownMillis），并补齐 Resilience4j 滑动窗口参数。
    # 粒度：全局单熔断（TV 执行定稿——单 Redis 宕机影响所有域，按域熔断只增加探针流量）。
    # 接在协议层 RedisOps.guarded：熔断打开时**不访问 Redis**、立即降级走 DB，
    # 不再每请求等 Jedis 的 1000ms 超时。
    # ⚠️ minimum-number-of-calls 必须 ≤ sliding-window-size（RedisBreakerProperties 绑定期校验）。
    # ------------------------------------------------------------------------
    redis-breaker:
      failure-rate-threshold: ${REDIS_BREAKER_FAILURE_RATE:50}
      sliding-window-size: ${REDIS_BREAKER_WINDOW_SIZE:10}
      minimum-number-of-calls: ${REDIS_BREAKER_MIN_CALLS:5}
      # OPEN 冷却时长（期满放行单个探针）。TV: redis.breaker.cooldownMillis=10000。
      # ⚠️ Duration 必须带单位后缀（10s），写裸数字会解析成秒级。
      wait-duration-in-open-state: ${REDIS_BREAKER_OPEN_WAIT:10s}
      permitted-number-of-calls-in-half-open-state: ${REDIS_BREAKER_HALF_OPEN_CALLS:1}
    # 评论缓存（S5 切片）。口径对齐 TV AppConfig.getCommentTtlSeconds()
    # ← app.properties 的 cache.comment.ttlMinutes=10。
    # TV 理由（原注释）："comment 10min（命中 38%~42%，新鲜度敏感：评论增删/点赞失效驱动，
    # 保持短 TTL 最安全）"——刻意比内容的 30 分钟短得多。
    # ⚠️ 单位口径：TV 的 getCommentTtlSeconds() 返回**秒**、getContentTtlMillis() 返回**毫秒**，
    #    本实现统一用 Duration（Spring 原生表达），消除这个历史不一致。
    comment-ttl: ${COMMENT_CACHE_TTL:10m}

  # 媒体资源 URL 前缀（S5 切片）。替代 TV 的 RequestContext.getContextPath()
  # （Servlet context path 的 ThreadLocal，本项目内嵌容器下恒为空串）。
  # ⚠️ 默认值必须保持空串：改它会让 /search/IdSearch 的 videoUrl/imageUrls 形状变化。
  media:
    base-url: ${MEDIA_BASE_URL:}

  # 可观测面（第三批 T2）。
  log:
    # 日志目录（唯一消费者是 logback-spring.xml 的 <springProperty source="video.log.dir">，
    # **应用代码不读它**，故没有对应的 Java 字段——见 LogProperties 类注释）。
    # 相对路径按进程 cwd 解析；logs/ 已在 .gitignore。
    dir: ${LOG_DIR:logs}
    # 访问日志的慢请求阈值（毫秒）。达到即把访问行的 slow 打为 1（不另起一行，TV D7 口径）。
    # ⚠️ 本键是纯数字毫秒（名字已含 ms），**不是** Duration——别写成 1s。
    slow-request-ms: ${LOG_SLOW_REQUEST_MS:1000}

  # 上传媒体**磁盘根目录**（S7）。⚠️ 与上面 media.base-url（URL 前缀）**严格分家**：
  #   本键 = 落盘 + /upload/** 静态服务共用**同一物理根**（TV 侧是 app.properties + context.xml
  #   两份配置 + 启动一致性校验；本项目一处配置，校验对象消失——B-12）。
  # dev 默认沿用老项目 stone：本项目 dev 库与老项目同为 TVDatabase，存量 content_media 行
  #   都指向该目录——不拷贝、不迁移（B-11）。将来"分家"= 拷目录（保持 video|image|cover
  #   子结构）+ 改这一行（或设环境变量 UPLOAD_ROOT），DB 存相对 URL，无需改动。
  # ⚠️ 空值拒绝启动（沿袭 TV AppShutDownListener 的 "upload.path 未配置或为空，拒绝启动"）。
  upload:
    root: ${UPLOAD_ROOT:D:/data/projects/VideoPlatform/stone}

  # 自动大V滞回判定（S4 切片，user 域但由 follow 事务内调用；见决策表 F-6）。
  # 口径对齐 TV app.properties 的 feed.bigv.threshold / feed.bigv.downgradeRatio。
  #
  # ⚠️ 数值口径（TV 原注释，勿随手改）：
  #   - threshold  = 升级线：粉丝数 >= 阈值 ⇒ auto_bigv 插入该行（"存在即自动大V"）；
  #   - downgrade-ratio = 滞回系数：降级线 = 系数 × 阈值。两线之间为"带内"，**状态不翻转**。
  #     合法区间 (0, 1]：>1 会让降级线高于升级线（滞回反向失效）；<=0 会让降级永不发生（状态只增不减）。
  #     由 BigVProperties 的紧凑构造器在**绑定期**校验（非法 ⇒ 启动即拒）。
  #   - 默认 10000 意味着**测试里关注几个用户不会触发状态迁移**；
  #     要测滞回必须用低阈值覆盖（FollowBigVTests 就是这么做的）。
  bigv:
    threshold: ${BIGV_THRESHOLD:10000}
    downgrade-ratio: ${BIGV_DOWNGRADE_RATIO:0.8}
    # 大V名单（S9 补入）：逗号分隔的用户 id；空 ⇒ 无名单（判定只走"状态表 ∪ 粉丝数≥阈值"两路）。
    # 口径对齐 TV app.properties 的 feed.bigv.userIds（默认空）。读侧三路并集的第①路。
    user-ids: ${BIGV_USER_IDS:}

  # feed 批次参数（S9）。逐条对齐 TV app.properties 的 feed.*（见 FeedProperties 类注释的对照表）。
  # ⚠️ 凡 Duration 属性**必须带单位后缀**（60m/1s/7d），裸数字会被解析成秒级，不报错只是行为诡异。
  feed:
    # 收件箱读缓存（ZSet）TTL，命中滑动续期。TV: feed.inbox.ttlMinutes=60
    inbox-ttl: ${FEED_INBOX_TTL:60m}
    # 重建/补推时"每关注作者取最近 K 条"。TV: feed.inbox.windowPerAuthor=20
    inbox-window-per-author: ${FEED_INBOX_WINDOW_PER_AUTHOR:20}
    # 重建窗口裁剪上界 C（表侧每用户行数上限）。TV: feed.inbox.windowMax=200
    inbox-window-max: ${FEED_INBOX_WINDOW_MAX:200}
    # 读侧归并窗口裁剪上界 M（收件箱腿 ∪ 大V发件箱腿）。TV: feed.readWindowMax=300
    read-window-max: ${FEED_READ_WINDOW_MAX:300}
    # 大V发件箱腿每作者取最近 N 条。TV: feed.outbox.windowSize=20
    outbox-window-size: ${FEED_OUTBOX_WINDOW_SIZE:20}
    # 大V发件箱读缓存 TTL。TV: feed.outbox.ttlMinutes=60
    outbox-ttl: ${FEED_OUTBOX_TTL:60m}
    # 写扩散粉丝游标每批批量。TV: feed.fanout.batch=200
    fanout-batch: ${FEED_FANOUT_BATCH:200}
    # 重建时"逐作者最近 K"的 SQL 批尺寸。TV: feed.rebuild.authorBatch=50
    rebuild-author-batch: ${FEED_REBUILD_AUTHOR_BATCH:50}
    # 大V批量判定的 IN 列表分块尺寸（执行参数，非判定输入）。TV: feed.bigv.queryBatch=200
    bigv-query-batch: ${FEED_BIGV_QUERY_BATCH:200}
    # 重建请求去抖窗口（per-user 尾沿合并）。TV: feed.rebuild.debounceMillis=1000。0 = 显式关闭去抖。
    rebuild-debounce: ${FEED_REBUILD_DEBOUNCE:1s}
    # 死信队列消息 TTL（证据窗口有界）。TV: feed.dlq.ttlMillis=604800000（7 天）。
    # ⚠️ TTL 是队列声明参数，改值须先删旧 feed.dlq 队列（broker 拒绝同名不同参声明 406）。
    dlq-ttl: ${FEED_DLQ_TTL:7d}
    # 异步投递线程池（第三批 T5 / 账 B8）：把「序列化 + publish」挪离 Web 线程——
    # 发布不等 publisher-confirm，但 broker 不可达时会等一次连接超时（dev 2s），
    # 那笔等待在 Web 线程上就是 RT 阻塞。TV: feed.delivery.queueCapacity / drainTimeoutMillis。
    # ⚠️ 这段是**嵌套键**：它绑到独立的 FeedDeliveryProperties（前缀 video.feed.delivery）——
    #    不能塞进 video.feed 的扁平记录（record 只认本前缀下的扁平键，嵌套会被静默忽略并绑成 0）。
    delivery:
      # 有界队列容量（满则丢弃 + WARNING；不得改 CallerRunsPolicy，否则 RT 解耦白做）。TV=1000
      queue-capacity: ${FEED_DELIVERY_QUEUE_CAPACITY:1000}
      # 关停时等待队列存量投完的上界（超时丢弃剩余，不挂住应用关停）。TV=5000ms
      drain-timeout: ${FEED_DELIVERY_DRAIN_TIMEOUT:5s}
    # 内存补偿缓冲（第三批 T5 / 账 B9）：broker 不可用窗口内投不出去的消息暂存内存、恢复后重放
    # （消费侧幂等 ⇒ 至少一次零副作用）。TV: feed.compensate.bufferCapacity。
    # ⚠️ 同为**嵌套键**：绑到独立的 FeedCompensateProperties（前缀 video.feed.compensate）。
    compensate:
      # 待重放队列容量（满则丢弃 + 首次告警后节流）。TV=10000
      buffer-capacity: ${FEED_COMPENSATE_BUFFER_CAPACITY:10000}
      # 恢复探测周期（= 不可达窗口长度 = 恢复补偿时延上界）。TV 是包内常量 30s，本仓入配置以便驱动
      probe-interval: ${FEED_COMPENSATE_PROBE_INTERVAL:30s}

# ----------------------------------------------------------------------------
# 可观测（第三批 T2 / 账 B3）：Actuator 端点暴露
# 只开 health 与 metrics —— 观测面要"看得见"，但不该顺手把 env/beans/heapdump
# 这类**能读到配置与内存**的端点在无认证的情况下开出去（本项目尚无 Security 链，C3/C4）。
# 日志侧的口径在 src/main/resources/logback-spring.xml（那里是本项目唯一的日志配置源）。
# ----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

# ----------------------------------------------------------------------------
# 日志级别（应用日志的**输出端、格式、分流**全在 logback-spring.xml）
# 注意：`access` / `audit` 两个专属 logger 的阈值在 logback 里**固定 INFO**，
#       不随这里的配置变化（审计不得被运维级别开关静默，TV 同款纪律）。
# ----------------------------------------------------------------------------
logging:
  level:
    root: INFO

